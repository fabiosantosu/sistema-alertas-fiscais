<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Alertas Fiscais</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <div class="container" style="max-width: 600px;">
        <h2 class="mt-4">Calculadora de Prazos Fiscais</h2>
        <form action="/calcular" method="POST" class="card p-4 mt-3 shadow">
            <div class="mb-3">
                <label class="form-label">Data da Fatura/Nota Fiscal</label>
                <input type="date" class="form-control" name="data_nota" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Valor (R$)</label>
                <input type="number" step="0.01" class="form-control" name="valor" placeholder="0.00" required>
            </div>
            <button type="submit" class="btn btn-success">Calcular Vencimento (30 dias)</button>
        </form>
    </div>
</body>
</html>
